# build.yml - compilation CI du pilote + outils (aucun WDK a installer chez toi)
#
# Runner windows-2022 : VS2022 (MSVC + link.exe) et LLVM deja presents.
# Le WDK est installe via NuGet selon la recette officielle de
# microsoft/windows-drivers-rs (.github/actions/install-wdk, source: nuget) :
#   - Microsoft.Windows.WDK.x64 (+ dependance Microsoft.Windows.SDK.CPP)
#   - env lues par wdk-build : WDKContentRoot / Version_Number / WDKBinRoot...
#
# Artefact : ext4fs-rs-dist (dist/ext4drv.sys + ext4ctl.exe + ext4cli.exe)
# Utilisation locale ensuite : sign.ps1 puis install.ps1 (PowerShell pur).

name: build-driver

on:
  push:
    branches: [main]
    paths:
      - "crates/**"
      - ".github/workflows/**"
      - "Cargo.toml"
      - "Cargo.lock"
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain Rust stable
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          cargo +stable --version

      - name: LLVM/libclang pour bindgen
        shell: pwsh
        run: |
          if (-not (Test-Path 'C:\Program Files\LLVM\bin\libclang.dll')) {
            Write-Host "libclang absent - installation via chocolatey"
            choco install llvm -y --no-progress
          }
          Write-Host "libclang present: $(Test-Path 'C:\Program Files\LLVM\bin\libclang.dll')"

      - name: Installation WDK 10.0.26100 via NuGet (recette windows-drivers-rs)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'

          # nuget.exe : preinstalle sur l'image runner, sinon telechargement direct
          if (Get-Command nuget -ErrorAction SilentlyContinue) {
            $nuget = 'nuget'
          } else {
            $nuget = "$env:RUNNER_TEMP\nuget.exe"
            Invoke-WebRequest -Uri 'https://dist.nuget.org/win-x86-commandline/latest/nuget.exe' -OutFile $nuget
          }

          # Derniere QFE du WDK 26100 publiee sur NuGet
          $idx = Invoke-RestMethod -Uri 'https://api.nuget.org/v3-flatcontainer/microsoft.windows.wdk.x64/index.json' -TimeoutSec 60
          $version = @($idx.versions | Where-Object { $_ -match '^10\.0\.26100\.\d+$' } | Sort-Object { [version]$_ })[-1]
          if (-not $version) { throw 'aucune version WDK 10.0.26100.x trouvee sur NuGet' }
          Write-Host "Version WDK resolue : $version"

          $root = 'C:\packages'
          & $nuget install Microsoft.Windows.WDK.x64 -Version $version -OutputDirectory $root -NonInteractive
          if ($LASTEXITCODE -ne 0) { throw "nuget install WDK.x64 a echoue ($LASTEXITCODE)" }

          $sdkVersion = '10.0.26100'
          $dirs = Get-ChildItem $root -Directory
          Write-Host "Packages installes : $(($dirs | ForEach-Object Name) -join ', ')"
          $sdkPkg = ($dirs | Where-Object { $_.Name -match "^Microsoft\.Windows\.SDK\.CPP\.$sdkVersion(\.\d+)?$" })[0]
          $wdkPkg = ($dirs | Where-Object { $_.Name -match "^Microsoft\.Windows\.WDK\.x64\.$sdkVersion(\.\d+)?$" })[0]
          if (-not $sdkPkg) { throw 'package Microsoft.Windows.SDK.CPP introuvable' }
          if (-not $wdkPkg) { throw 'package Microsoft.Windows.WDK.x64 introuvable' }
          if (-not (Test-Path "$($wdkPkg.FullName)\c")) { throw 'WDKContentRoot inexistant' }

          # Variables lues par wdk-build (detect_wdk_content_root + toolchain)
          "Version_Number=$sdkVersion.0" >> $env:GITHUB_ENV
          "WindowsSdkBinPath=$($sdkPkg.FullName)\c\bin" >> $env:GITHUB_ENV
          "WDKContentRoot=$($wdkPkg.FullName)\c\" >> $env:GITHUB_ENV
          "WDKBinRoot=$($wdkPkg.FullName)\c\bin\$sdkVersion.0" >> $env:GITHUB_ENV
          "WDKToolRoot=$($wdkPkg.FullName)\c\tools\$sdkVersion.0" >> $env:GITHUB_ENV
          Write-Host "WDKContentRoot = $($wdkPkg.FullName)\c\"

      - name: Build ext4-core + ext4cli (workspace)
        shell: pwsh
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        run: |
          cargo build -p ext4-core --release
          if ($LASTEXITCODE -ne 0) { exit 1 }
          cargo build -p ext4cli --release
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build pilote ext4drv (WDK)
        shell: pwsh
        env:
          LIBCLANG_PATH: 'C:\Program Files\LLVM\bin'
        working-directory: crates/ext4drv
        run: |
          cargo build --profile driver-release
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Build ext4ctl (user-mode)
        shell: pwsh
        working-directory: crates/ext4ctl
        run: |
          cargo build --release
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Assemblage dist\
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item crates\ext4drv\target\driver-release\ext4drv.dll dist\ext4drv.sys
          Copy-Item crates\ext4ctl\target\release\ext4ctl.exe dist\
          Copy-Item target\release\ext4cli.exe dist\
          Get-ChildItem dist | Format-Table Name, Length

      - name: Upload artefact dist
        uses: actions/upload-artifact@v4
        with:
          name: ext4fs-rs-dist
          path: dist/

      - name: Archive bindings wdk-sys (verite terrain bindgen)
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bindings-out | Out-Null
          $b = Get-ChildItem -Path crates\ext4drv\target -Recurse -Filter "ntddk.rs" -ErrorAction SilentlyContinue |
               Where-Object { $_.FullName -like "*wdk-sys*out*" } | Select-Object -First 3
          $i = 0
          foreach ($f in $b) {
            Copy-Item $f.FullName ("bindings-out\ntddk-bindings-$i.rs")
            Write-Host "bindings: $($f.FullName) ($((Get-Item $f.FullName).Length) octets)"
            $i++
          }

      - name: Upload bindings wdk-sys
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wdk-sys-bindings
          path: bindings-out/
          if-no-files-found: ignore
